spring:
  application:
    name: backend-service
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/backend_service?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    org:
      hibernate:
        SQL: debug
