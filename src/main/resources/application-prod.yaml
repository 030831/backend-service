spring:
  datasource:
    # 호스트 mysql = 4-2 compose.yaml의 서비스 이름. 사용자·비밀번호는 환경 변수로만 받는다(아래 표).
    url: jdbc:mysql://mysql:3306/backend_service?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
  jpa:
    hibernate:
      # 운영에서는 절대 create/update를 쓰지 않는다. 테이블은 Flyway가 만든다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    # 이미 적용한 V 파일이 바뀌면(checksum 불일치) 앱을 띄우지 않는다. 기본값이지만 뜻을 남긴다.
    validate-on-migrate: true
    # flyway clean(모든 테이블 삭제)을 막는다. 기본값이지만 뜻을 남긴다.
    clean-disabled: true

server:
  # Caddy가 붙이는 X-Forwarded-Proto/For 헤더를 Tomcat이 읽는다. 그래야 HTTPS 요청으로 인식해 쿠키에 Secure가 붙는다.
  forward-headers-strategy: native
  # 컨테이너를 내릴 때 처리 중인 요청을 끝내고 멈춘다(기본 30초).
  shutdown: graceful
  servlet:
    session:
      # 마지막 요청 뒤 30분이 지나면 세션(로그인)이 끝난다. Boot 기본값과 같지만 명시한다.
      timeout: 30m
      cookie:
        secure: true      # HTTPS로만 세션 쿠키를 보낸다
        http-only: true   # 자바스크립트가 세션 쿠키를 읽지 못한다
        same-site: lax    # 다른 사이트에서 시작된 POST에는 쿠키를 붙이지 않는다

management:
  endpoints:
    web:
      exposure:
        include: health   # /actuator/health만 연다
  endpoint:
    health:
      show-details: never # {"groups":["liveness","readiness"],"status":"UP"}만 보여 준다. DB 종류·상태 세부는 감춘다

logging:
  level:
    org:
      hibernate:
        SQL: info         # 공통 파일의 debug를 덮어 운영 로그에 SQL을 남기지 않는다

admin:
  bootstrap:
    # 환경 변수가 없으면 빈 문자열 → AdminBootstrapProperties.isConfigured()가 false → 관리자를 만들지 않는다.
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    name: ${ADMIN_BOOTSTRAP_NAME:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}