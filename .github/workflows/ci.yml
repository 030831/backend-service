name: CI

on:
  push:
    branches: [main]

# GITHUB_TOKEN에 줄 권한. 이미지를 GHCR에 올리려면 packages: write가 필요하다.
permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}   # ghcr.io/030831/backend-service

jobs:
  test:
    name: 테스트 (MySQL 8.4 서비스 컨테이너)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-ci
          MYSQL_DATABASE: backend_service_test   # IntegrationTestSupport가 확인하는 DB 이름
          MYSQL_USER: backend_app                # application-test.yaml의 username
          MYSQL_PASSWORD: ci-password
        ports:
          - 3306:3306                            # 러너의 localhost:3306 → 컨테이너 3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6     # Gradle과 의존성을 캐시한다
      - name: 테스트 실행
        run: bash ./gradlew --no-daemon test
        env:
          SPRING_DATASOURCE_PASSWORD: ci-password  # 비밀번호 파일 대신 환경 변수로

  image:
    name: 이미지 빌드와 GHCR push (linux/arm64)
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}          # 4-3의 deploy 잡이 쓸 태그
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: jar 만들기 (테스트는 앞 잡에서 끝났다)
        run: bash ./gradlew --no-daemon bootJar -x test
      - name: 이미지 태그 정하기 (sha-커밋 7자리)
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4         # x86 러너에서 arm64를 흉내 낸다
      - uses: docker/setup-buildx-action@v4       # 다른 CPU용 이미지를 만드는 빌더
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max