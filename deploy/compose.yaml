services:
  app:
    # IMAGE_TAG는 .env에서 온다. 처음에는 latest, 4-3부터는 배포 스크립트가 sha-… 로 바꾼다.
    image: ghcr.io/030831/backend-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy     # MySQL이 준비된 뒤에 앱을 켠다
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_NAME: ${ADMIN_BOOTSTRAP_NAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50   # 힙 최대 = 컨테이너 메모리 상한의 50%
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:8080:8080"        # 서버 자신에서만 접속. 인터넷에는 열리지 않는다
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"              # 로그가 디스크를 다 채우지 않게 10MB × 3개까지만
        max-file: "3"

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --innodb-buffer-pool-size=256M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}   # 첫 실행에서 이 DB를 만들고
      MYSQL_USER: ${MYSQL_USER}           # 이 사용자에게 그 DB의 모든 권한을 준다
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql        # 데이터는 볼륨에. 컨테이너를 지워도 남는다
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  caddy_data:
  caddy_config: